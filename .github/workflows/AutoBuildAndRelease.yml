name: TVTComment build and release

on:
  workflow_dispatch:
    inputs:
      manual:
        description: 'Release version (e.g. 4.0.2 or v4.0.2)'
        type: string
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Update release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check release branch
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "Run this workflow on a branch."
            exit 1
          fi

      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Update version and copyright year
        id: metadata
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.manual }}
        run: ./.github/scripts/Update-ReleaseMetadata.ps1 -Version $env:RELEASE_INPUT

      - name: Commit release metadata
        id: commit
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists."
            exit 1
          fi
          git add -- TVTComment/TVTComment.csproj TVTComment/Views/ShellContents/BasicSettingControl.xaml Viewer/Viewer.cpp LICENSE
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update release metadata for v$RELEASE_VERSION"
            git push origin "HEAD:$GITHUB_REF"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  exe-build:
    name: TVTComment.exe build
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Include CoreTweet Nuget
        run: nuget sources add -name CoreTweetSource -source ${{ github.workspace }}\CoreTweetNuget

      - name: Replace id & secret
        shell: powershell
        run: |
          $data=Get-Content TVTComment/ViewModels/SettingsWindowViewModel.cs | % { $_ -replace 'secrets\["Annict:ClientId"\]','"${{ secrets.CLIENT_ID }}"' }
          $data | Out-File TVTComment/ViewModels/SettingsWindowViewModel.cs
          $data=Get-Content TVTComment/ViewModels/SettingsWindowViewModel.cs | % { $_ -replace 'secrets\["Annict:ClientSecret"\]','"${{ secrets.CLIENT_SECRET }}"' }
          $data | Out-File TVTComment/ViewModels/SettingsWindowViewModel.cs

      - name: Build (TVTComment.exe)
        run: dotnet publish TVTComment/TVTComment.csproj -m -c Release /p:PublishProfile=ReleaseProfile

      - name: Copy asset (TVTComment.exe)
        shell: powershell
        run: |
          New-Item -Path Asset -ItemType Directory
          New-Item -Path Asset/misc -ItemType Directory
          Copy-Item -Path TVTComment/bin/Release/net10.0-windows/publish/TvtComment.exe -Destination Asset/
          Copy-Item -Path TVTComment/Data/* -Destination Asset/
          Copy-Item -Path CHANGELOG.md -Destination Asset/misc/CHANGELOG.txt
          Copy-Item -Path LICENSE -Destination Asset/misc/LICENSE.txt
          Copy-Item -Path THIRDPARTY_LICENSE -Destination Asset/misc/THIRDPARTY_LICENSE.txt
          Copy-Item -Path README.md -Destination "Asset/misc/README edit noriokun4649.txt"

      - name: Before CHANGELOG get
        shell: powershell
        run: |
          $env:before = git log -2 --reverse --format='%H' CHANGELOG.md
          $env:before = $env:before.Substring(0,40)
          git checkout $env:before CHANGELOG.md
          Copy-Item -Path CHANGELOG.md -Destination Asset/misc/OLDCHANGELOG.txt
      - name: Upload asset to Artifacts (TVTComment.exe)
        uses: actions/upload-artifact@v7
        with:
          name: TvtComment
          if-no-files-found: error
          path: Asset/

  tvtp-build:
    name: tvtcomment.tvtp build
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x64
          - Win32

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build (tvtcomment.tvtp)
        run: msbuild Viewer/Viewer.vcxproj -m /p:Configuration="Release" /p:Platform="${{ matrix.platform }}"

      - name: Copy asset (tvtcomment.tvtp)
        shell: powershell
        run: |
          New-Item -Path Asset -ItemType Directory
          Copy-Item -Path Viewer/${{ matrix.platform }}/Release/TvtComment.tvtp -Destination Asset/

      - name: Upload asset to Artifacts (tvtcomment.tvtp)
        uses: actions/upload-artifact@v7
        with:
          name: TvtComment_${{ matrix.platform }}
          if-no-files-found: error
          path: Asset/

  release:
    needs:
      - prepare
      - exe-build
      - tvtp-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: Asset/

      - name: Get CHANGELOG
        run: |
          echo 'CHANGELOG<<EOF' >> $GITHUB_ENV
          diff -u --strip-trailing-cr Asset/TvtComment/misc/OLDCHANGELOG.txt Asset/TvtComment/misc/CHANGELOG.txt | grep ^+ | grep -v ^+++ | sed s/^+// >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Move misc files
        run: |
          mv Asset/TvtComment/misc/* Asset/ 
          rm Asset/OLDCHANGELOG.txt
          rmdir Asset/TvtComment/misc

      - name: Repack assets
        run: |
          cd Asset
          7z a -r "../TvtComment_v${RELEASE_VERSION}.zip" *

      - name: Tag release commit
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_COMMIT }}
          name: Release v${{ env.RELEASE_VERSION }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
          files: TvtComment_v${{ env.RELEASE_VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
